# CI deploy for HiveMos — the SMSinBox model: repository secrets are the
# source of truth for the administrator account.
#
# INERT BY DEFAULT: the deploy job below is gated on the repository
# variable CI_DEPLOY_ENABLED. Until the owner sets that variable to
# "true" and adds the secrets listed below, every push simply skips the
# job and stays green; manual deploys from the box keep working exactly
# as before.
#
# Required repository secrets
# (repo Settings -> Secrets and variables -> Actions -> Secrets):
#   CLOUDFLARE_API_TOKEN   API token allowed to deploy the Worker and
#                          run D1 commands against the hivemos database
#   CLOUDFLARE_ACCOUNT_ID  Cloudflare account that owns the hivemos Worker
#   ADMIN_USERNAME         administrator username (source of truth)
#   ADMIN_PASSWORD         administrator password (source of truth)
# Required repository variable (same settings page, Variables tab):
#   CI_DEPLOY_ENABLED = true
#
# How the admin sync works: the Deploy step runs scripts/deploy.sh with
# those secrets in the environment. After a successful deploy, deploy.sh
# runs scripts/sync-admin.mjs, which aligns the single administrator row
# in D1 to the secrets: create the row if missing, rename it if the
# username drifted, replace the password hash (and clear all sessions)
# if the password changed, write nothing when everything already
# matches. Changing the admin password = edit the ADMIN_PASSWORD secret
# and redeploy (any push, or re-run this workflow manually).

name: Deploy

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: hivemos-production-deploy
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    if: ${{ vars.CI_DEPLOY_ENABLED == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # No `npm ci` step: this repo has no package.json or lockfile.
      # The deploy tooling runs through `npx wrangler`, exactly like a
      # manual deploy from the box; Node 22 matches the box's runtime.
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Check gate
        run: node scripts/check.mjs

      - name: Deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          ADMIN_USERNAME: ${{ secrets.ADMIN_USERNAME }}
          ADMIN_PASSWORD: ${{ secrets.ADMIN_PASSWORD }}
        run: sh scripts/deploy.sh
