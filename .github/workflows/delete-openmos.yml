# One-shot removal of the OpenMos worker. The owner ordered the script
# deleted on 2026-11-10 (a second abuse report hit the renamed script
# within minutes; renamed redeploys of HiveMos are off the table).
# This workflow exists to carry out that deletion through the same
# repository-token channel that created the script, and is itself
# removed from the repo right after it has run.

name: Delete OpenMos

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  delete-openmos:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Delete the openmos script
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler delete --name openmos --force
