# One-shot full export of the hivemos D1 database (schema + data, SQL)
# through the repository-token channel (box wrangler OAuth is dead).
# The SQL file is uploaded as a short-retention workflow artifact; the
# operator downloads it into ~/workspace/hivemos-backups/ and deletes
# the artifact right after. This workflow is removed once it has run.

name: Export HiveMos D1

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Export D1
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          npx wrangler d1 export hivemos --remote --output hivemos-d1-2026-11-10.sql
          ls -la hivemos-d1-2026-11-10.sql
          grep -c "CREATE TABLE" hivemos-d1-2026-11-10.sql || true

      - name: Upload SQL as artifact
        uses: actions/upload-artifact@v4
        with:
          name: hivemos-d1-export
          path: hivemos-d1-2026-11-10.sql
          retention-days: 1
