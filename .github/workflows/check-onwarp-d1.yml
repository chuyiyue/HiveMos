# One-shot check: list OnWarp account D1 databases through the
# repository API token (tests whether the token reaches that account).
# Removed right after it has run.

name: Check OnWarp D1

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: List OnWarp D1 databases
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          echo "== wrangler d1 list (OnWarp b4d48bf1) =="
          CLOUDFLARE_ACCOUNT_ID=b4d48bf1df46d3ead23002dee838719e npx wrangler d1 list || true
          echo "== raw API =="
          curl -s -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" "https://api.cloudflare.com/client/v4/accounts/b4d48bf1df46d3ead23002dee838719e/d1/database?per_page=100" | head -c 3000
