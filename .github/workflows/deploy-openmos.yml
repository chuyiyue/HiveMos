# Manual deploy of the OpenMos worker: the same HiveMos code and the
# same D1 database under a second script name (the hivemos script is
# suspended by Cloudflare as of 2026-11-10; this tests whether a fresh
# script name runs, and can serve as the entry point meanwhile).
#
# Trigger it from the Actions tab (workflow_dispatch only; regular
# pushes keep deploying just hivemos through deploy.yml).
#
# Uses the same repository secrets as deploy.yml. One extra optional
# secret is honoured when present:
#   VAULT_KEY   the AES-GCM sealing key shared with the hivemos worker.
#               Worker secrets are write-only, so it cannot be copied
#               from hivemos automatically; until this secret is added,
#               OpenMos runs but every feature that decrypts sealed
#               data (vault reveals, TOTP codes, machine credentials,
#               agent-token reveals) fails closed.

name: Deploy OpenMos

on:
  workflow_dispatch:

concurrency:
  group: openmos-production-deploy
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy-openmos:
    if: ${{ vars.CI_DEPLOY_ENABLED == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Check gate
        run: node scripts/check.mjs

      # Pending production migrations (0075/0076 shipped in code before
      # any D1 channel was available). Each apply is best-effort: an
      # already-present column errors and is ignored; the verify step
      # prints the truth and the migration rows are recorded to match.
      - name: Apply pending D1 migrations (0075, 0076)
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          npx wrangler d1 execute hivemos --remote --file migrations/0075_snapshot_error.sql || true
          npx wrangler d1 execute hivemos --remote --file migrations/0076_mirror_sync_fail_count.sql || true
          echo "== verify columns =="
          npx wrangler d1 execute hivemos --remote --json --command "SELECT (SELECT COUNT(*) FROM pragma_table_info('mcp_servers') WHERE name='snapshot_error') AS c1, (SELECT COUNT(*) FROM pragma_table_info('calendars') WHERE name='sync_fail_count') AS c2"
          npx wrangler d1 execute hivemos --remote --command "INSERT OR IGNORE INTO d1_migrations (name) VALUES ('0075_snapshot_error.sql'), ('0076_mirror_sync_fail_count.sql')"

      - name: Deploy OpenMos
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler deploy -c wrangler.openmos.jsonc --var "BUILD_ID:$(git rev-parse --short HEAD)"

      # Same admin alignment as the hivemos deploy (targets the shared
      # hivemos database by name; idempotent).
      - name: Sync admin
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          ADMIN_USERNAME: ${{ secrets.ADMIN_USERNAME }}
          ADMIN_PASSWORD: ${{ secrets.ADMIN_PASSWORD }}
        run: node scripts/sync-admin.mjs

      - name: Sync worker secrets onto OpenMos
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          GITHUB_CLIENT_ID: ${{ secrets.GH_CLIENT_ID }}
          GITHUB_CLIENT_SECRET: ${{ secrets.GH_CLIENT_SECRET }}
          VAULT_KEY: ${{ secrets.VAULT_KEY }}
        run: |
          if [ -n "${GITHUB_CLIENT_ID:-}" ] && [ -n "${GITHUB_CLIENT_SECRET:-}" ]; then
            printf %s "$GITHUB_CLIENT_ID" | npx wrangler secret put GITHUB_CLIENT_ID -c wrangler.openmos.jsonc >/dev/null
            printf %s "$GITHUB_CLIENT_SECRET" | npx wrangler secret put GITHUB_CLIENT_SECRET -c wrangler.openmos.jsonc >/dev/null
            echo "github secrets aligned"
          fi
          if [ -n "${VAULT_KEY:-}" ]; then
            printf %s "$VAULT_KEY" | npx wrangler secret put VAULT_KEY -c wrangler.openmos.jsonc >/dev/null
            echo "vault key aligned"
          else
            echo "VAULT_KEY repository secret not set; sealed-data features stay closed on OpenMos"
          fi

      - name: Smoke check
        run: |
          sleep 10
          curl -s https://openmos.lokfu.workers.dev/api/version || true
