<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="robots" content="noindex, nofollow" />
    <title>登录 · HiveMos</title>
    <script src="/theme-boot.js"></script>
    <link rel="stylesheet" href="/style.css" />
      <link rel="icon" href="/logo.png" type="image/png" />
  </head>
  <body class="auth-body">
    <main class="auth-card">
      <span class="brand">
        <span class="mark" aria-hidden="true"><img src="/logo.png" alt="" /></span>
        <span class="brand-name">HiveMos</span>
      </span>
      <h1 class="auth-title">登录</h1>
      <p id="login-error" class="callout danger" role="alert" hidden></p>
      <form id="login-form" novalidate>
        <label>账号
          <input id="username" name="username" type="text" autocomplete="username" maxlength="256" spellcheck="false" autofocus />
        </label>
        <label>密码
          <span class="password-field">
            <input id="password" name="password" type="password" autocomplete="current-password" maxlength="256" />
            <button id="password-toggle" class="icon-btn" type="button" aria-label="显示密码" aria-pressed="false">
              <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><use href="/icons.svg#icon-eye"/></svg>
            </button>
          </span>
        </label>
        <button id="login-submit" type="submit">登录</button>
      </form>
      <form id="totp-form" class="auth-form auth-step" hidden>
        <h2 id="totp-title" class="auth-step-title">两步验证</h2>
        <p class="subtle">输入验证器上的 6 位验证码，或一个未使用的恢复码</p>
        <p id="totp-error" class="callout danger" role="alert" hidden></p>
        <label>验证码
          <input id="totp-code" name="code" inputmode="numeric" autocomplete="one-time-code" maxlength="24" placeholder="6 位验证码或恢复码" />
        </label>
        <button id="totp-submit" type="submit">验证并登录</button>
        <button id="totp-cancel" class="ghost" type="button">返回</button>
      </form>
    </main>
    <script src="/common.js"></script>
    <script src="/login.js"></script>
  </body>
</html>
